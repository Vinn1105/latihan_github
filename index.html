
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Developer Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background: #1e293b;
            max-width: 380px;
            width: 100%;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 15px 40px #00000040;
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #06b6d4;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .role {
            color: #22d3ee;
            margin-bottom: 18px;
        }

        .description {
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            background: #06b6d4;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .button:hover {
            background: #67e8f9;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="profile-card">
        <div class="avatar">AK</div>

        <h1>Alvin Kurnia</h1>

        <p class="role">Information Technology Student</p>

        <p class="description">
            I am learning web development, computer
            networking, and GitHub to improve my
            programming skills.
        </p>

        <a class="button"
           href="https://github.com"
           target="_blank">
            Visit GitHub
        </a>

        <p class="footer">
            Built with HTML and CSS
        </p>
    </div>
</body>
</html>
